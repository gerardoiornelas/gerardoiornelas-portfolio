# For committed Markdown use template-receipt.md: its frontmatter is the validated repository format.
# UI-GATES receipt schema.
#
# In this repo, receipts are committed as Markdown files under knowledge/receipts/,
# named YYYY-MM-DD-slug.md (see knowledge/receipts/2026-09-01-ui-gates-page.md for
# the actual frontmatter shape). The `id` field below is an optional internal
# cross-reference for linking a receipt to an intent — it is metadata inside the
# file, not a filename convention. Do not rename existing receipts to match it.
#
# A receipt closes the loop with the After Action Review
# (docs/compound-engineering/ui-gates-canon.md#closing-protocol): the intent answers
# "what was supposed to happen", the verification answers "what actually happened",
# and the two fields below answer "why was there a difference" and
# "what will we do differently". Committed Markdown receipts carry these as the
# `## After Action Review` section; `npm run okf:validate` requires it.
#
# See docs/compound-engineering/operating-system.md#execution-receipt for the canon.

receipt:
  id: RCP-YYYY-NNNN # optional, sequential per year, e.g. RCP-2026-0001
  intent: INT-YYYY-NNNN # the intent this execution was authorized under
  agent: "" # e.g. claude
  proposed_action: "" # e.g. repository.write
  scope:
    - "" # affected files or resources
  authority:
    state: "" # observe | delegated | gated | prohibited
    source: "" # e.g. intent delegation, principal approval
    budget: {} # optional, e.g. { max_retries: 2 }; see operating-system.md#authority-states
  executed_at: "" # ISO-8601 timestamp
  result:
    commit: "" # git sha, if applicable
  verification:
    evidence: []
    status: "" # e.g. verified, verified-with-environment-limit
    retries: 0 # count of Execute → Verify cycles before acceptance; checked against authority.budget.max_retries
  discrepancy_analysis: # AAR Q3 — why actual differed from intended
    expected: "" # from the intent's success_evidence
    actual: "" # summarized from verification results
    root_cause: "" # supported cause, no discrepancy, or cause unknown
  learning_action: # AAR Q4 — what this loop will do differently
    sustain: "" # what is promoted, and to which knowledge level
    improve: "" # the corrective; a procedural fix to the skill/rules is gated by default
  reuse: "" # what future work should learn from this
